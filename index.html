<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satellite Map</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
}

#map {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div id="map"></div>

<script>
    // Check for URL params first (passed from AIR)
    var params = new URLSearchParams(window.location.search);
    var urlLat = parseFloat(params.get('lat'));
    var urlLon = parseFloat(params.get('lon'));

    function initMap() {
        if (!isNaN(urlLat) && !isNaN(urlLon)) {
            // Use coordinates from AIR via URL params
            createMap(urlLat, urlLon);
        } else {
            // Fall back to browser Geolocation API
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(pos) {
                        createMap(pos.coords.latitude, pos.coords.longitude);
                    },
                    function(err) {
                        // Geolocation failed - default to Sofia
                        createMap(42.6977, 23.3219);
                    }
                );
            } else {
                createMap(42.6977, 23.3219);
            }
        }
    }

    function createMap(lat, lon) {
        var map = new google.maps.Map(document.getElementById('map'), {
            center: { lat: lat, lng: lon },
            zoom: 19,
            mapTypeId: 'satellite',   // satellite view
            heading: 0,               // rotation in degrees (0 = north up)
            tilt: 0,                  // minimal tilt to enable rotation
            gestureHandling: 'greedy', // single finger pan, two finger rotate/tilt
            disableDefaultUI: false,
            rotateControl: true,
            mapTypeControl: true,
            fullscreenControl: false
        });

        // Place marker at location
        new google.maps.Marker({
            position: { lat: lat, lng: lon },
            map: map
        });
    }
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCrc3zdPV6WbcgtYuiVrK4O89ylRVtTti0&callback=initMap" async defer></script>

</body>
</html>
