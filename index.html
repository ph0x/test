  // ---------------------------------------------------------------------------
  // Minimal input helpers.
  // ---------------------------------------------------------------------------
  class InputState {
    constructor() {
      this.down = new Set();
      this.justPressed = new Set();
      this.justReleased = new Set();
      this.mouse = {
        x: 0,
        y: 0,
        pressed: false,
        justPressed: false,
        justReleased: false
      };
    }

    beginFrame() {
      this.justPressed.clear();
      this.justReleased.clear();
      this.mouse.justPressed = false;
      this.mouse.justReleased = false;
    }

    normalizeKey(key) {
      const map = {
        ' ': 'SPACE',
        'Spacebar': 'SPACE',
        'Enter': 'ENTER',
        'Escape': 'ESCAPE',
        'ArrowLeft': 'LEFT',
        'ArrowRight': 'RIGHT',
        'ArrowUp': 'UP',
        'ArrowDown': 'DOWN',
        'PageUp': 'PAGEUP',
        'PageDown': 'PAGEDOWN',
        'Home': 'HOME',
        'End': 'END'
      };
      if (map[key]) return map[key];
      if (/^F\d+$/i.test(key)) return key.toUpperCase();
      if (key.length === 1) return key.toUpperCase();
      return key.toUpperCase();
    }

    install(canvas) {
      window.addEventListener('keydown', (e) => {
        Audio.unlock();
        const k = this.normalizeKey(e.key);
        if (!this.down.has(k)) this.justPressed.add(k);
        this.down.add(k);
        if ([
          'SPACE', 'LEFT', 'RIGHT', 'UP', 'DOWN', 'ENTER', 'ESCAPE',
          'PAGEUP', 'PAGEDOWN', 'HOME', 'END'
        ].includes(k)) e.preventDefault();
      });

      window.addEventListener('keyup', (e) => {
        const k = this.normalizeKey(e.key);
        if (this.down.has(k)) this.justReleased.add(k);
        this.down.delete(k);
      });

      const updateMouse = (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        this.mouse.x = (e.clientX - rect.left) * scaleX;
        this.mouse.y = (e.clientY - rect.top) * scaleY;
      };

      canvas.addEventListener('mousemove', updateMouse);
      canvas.addEventListener('touchstart', (e) => {
        Audio.unlock();
      }, { passive: true });
      canvas.addEventListener('mousedown', (e) => {
        Audio.unlock();
        updateMouse(e);
        if (!this.mouse.pressed) this.mouse.justPressed = true;
        this.mouse.pressed = true;
      });
      window.addEventListener('mouseup', (e) => {
        updateMouse(e);
        if (this.mouse.pressed) this.mouse.justReleased = true;
        this.mouse.pressed = false;
      });
    }

    keyPressed(k) {
      return this.down.has(k.toUpperCase());
    }

    keyJustPressed(k) {
      return this.justPressed.has(k.toUpperCase());
    }

    pressed(k) {
      return this.keyPressed(k);
    }
  }

  // ---------------------------------------------------------------------------
  // Tiny Random port.
  // ---------------------------------------------------------------------------
  class Random {
    constructor(Seed = 1) {
      this.seed = Seed || 1;
    }
    setSeed(Seed) {
      this.seed = Seed || 1;
    }
    rand(n) {
      return n === 0 ? 0 : this.nextInt() % n;
    }
    nextInt() {
      return this.gen();
    }
    nextDouble() {
      return this.gen() / 2147483647;
    }
    gen() {
      this.seed = (this.seed * 16807) % 2147483647;
      return this.seed;
    }
  }

  // ---------------------------------------------------------------------------
  // Tiny sprite helper.

  class FlxSprite {
    constructor() {
      this.x = 0;
      this.y = 0;
      this.width = 0;
      this.height = 0;
      this.frame = 0;
      this.frames = 1;
      this.frameWidth = 0;
      this.frameHeight = 0;
      this.alpha = 1;
      this.visible = true;
      this.exists = true;
      this.scale = { x: 1, y: 1 };
      this.offset = { x: 0, y: 0 };
      this.angle = 0;
      this.color = 0xffffff;
      this.image = null;
      this.imageLoaded = false;
      this.loadFinished = false;
      this.sourceName = '';
      this.placeholderKind = 'rect';
      this.customDraw = null;
    }

    loadGraphic(name, animated = false, reverse = false, width = 0, height = 0) {
      this.sourceName = name;
      const img = new Image();
      img.onload = () => {
        this.imageLoaded = true;
        this.loadFinished = true;
        this.image = img;
        if (width > 0 && height > 0) {
          this.frameWidth = width;
          this.frameHeight = height;
          this.width = width;
          this.height = height;
          const cols = Math.max(1, Math.floor(img.width / width));
          const rows = Math.max(1, Math.floor(img.height / height));
          this.frames = Math.max(1, cols * rows);
        } else {
          this.frameWidth = img.width;
          this.frameHeight = img.height;
          this.width = img.width;
          this.height = img.height;
          this.frames = 1;
        }
      };
      img.onerror = () => {
        this.imageLoaded = false;
        this.loadFinished = true;
        this.image = null;
        if (width > 0 && height > 0) {
          this.frameWidth = width;
          this.frameHeight = height;
          this.width = width;
          this.height = height;
          this.frames = 2;
        } else {
          this.width = this.width || 64;
          this.height = this.height || 64;
          this.frameWidth = this.width;
          this.frameHeight = this.height;
          this.frames = 1;
        }
      };
      img.src = name;

      if (width > 0 && height > 0) {
        this.frameWidth = width;
        this.frameHeight = height;
        this.width = width;
        this.height = height;
      }
      return this;
    }

    createGraphic(w, h, color) {
      this.width = w;
      this.height = h;
      this.frameWidth = w;
      this.frameHeight = h;
      this.frames = 1;
      this.loadFinished = true;
      this.placeholderKind = 'solid';
      this.graphicColor = color;
      return this;
    }

    render() {
      if (!this.visible || !this.exists) return;
      Game._drawSpriteRaw(this);
    }
  }

  // ---------------------------------------------------------------------------
  // Very small audio helper.
  // ---------------------------------------------------------------------------
  class AudioHandle {
    constructor(src, loop) {
      this.src = src;
      this.loop = loop;
      this.audio = null;
      this.playing = false;
      this.volume = 1;
      try {
        this.audio = new window.Audio(src);
        this.audio.preload = 'auto';
        this.audio.loop = loop;
        this.audio.addEventListener('ended', () => {
          this.playing = false;
        });
      } catch (e) {
        this.audio = null;
      }
    }
    play() {
      if (!this.audio) return Promise.resolve(false);
      this.audio.loop = this.loop;
      this.audio.volume = this.volume;
      try {
        this.audio.currentTime = 0;
      } catch (e) {}
      let p;
      try {
        p = this.audio.play();
      } catch (e) {
        this.playing = false;
        return Promise.resolve(false);
      }
      if (p && typeof p.then === 'function') {
        return p.then(() => {
          this.playing = true;
          return true;
        }).catch(() => {
          this.playing = false;
          return false;
        });
      }
      this.playing = true;
      return Promise.resolve(true);
    }
    stop() {
      if (!this.audio) return;
      try {
        this.audio.pause();
        this.audio.currentTime = 0;
      } catch (e) {}
      this.playing = false;
    }
    pause() {
      if (!this.audio) return;
      try { this.audio.pause(); } catch (e) {}
    }
  }

  class AudioSystem {
    constructor() {
      this.sfx = [];
      this.sfxperm = [];
      this.bgm = [];
      this.mute = false;
      this.paused = false;
      this.userInteracted = false;
      this.pendingBgm = null;
      this.bgmRequested = null;
    }
    unlock() {
      this.userInteracted = true;
      if (this.pendingBgm && !this.mute) {
        const s = this.pendingBgm;
        this.pendingBgm = null;
        s.stop();
        const r = s.play();
        if (r && typeof r.then === 'function') {
          r.then((ok) => {
            if (!ok && !this.mute) this.pendingBgm = s;
          }).catch(() => {
            if (!this.mute) this.pendingBgm = s;
          });
        }
      }
    }
    loadsfx(src) {
      const r = new AudioHandle(src, false);
      this.sfx.push(r);
      this.sfxperm.push(false);
      return r;
    }
    loadbgm(src) {
      const r = new AudioHandle(src, true);
      this.bgm.push(r);
      return r;
    }
    setvol(s, v) {
      if (!s) return;
      s.volume = v / 100.0;
      if (s.audio) s.audio.volume = s.volume;
    }
    setvolbgmall(v) {
      for (const s of this.bgm) this.setvol(s, this.mute ? 0 : v);
    }
    setvolsfxall(v) {
      for (let i = 0; i < this.sfx.length; i++) {
        if (!this.sfxperm[i]) this.setvol(this.sfx[i], v);
      }
    }
    stopall() {
      this.paused = false;
      this.pendingBgm = null;
      this.bgmRequested = null;
      for (const s of this.sfx) s.stop();
      for (const s of this.bgm) s.stop();
    }
    stopbgmall() {
      this.pendingBgm = null;
      this.bgmRequested = null;
      for (const s of this.bgm) s.stop();
    }
    pauseall(b) {
      if (this.paused === b) return;
      this.paused = b;
      if (b) {
        for (const s of this.sfx) s.pause();
        for (const s of this.bgm) s.pause();
      } else {
        for (const s of this.bgm) {
          if (s.playing && s.audio) {
            const p = s.audio.play();
            if (p && typeof p.catch === 'function') p.catch(() => {});
          }
        }
      }
    }
    play(s) {
      if (!s) return;
      const isBgm = this.bgm.indexOf(s) >= 0;
      if (this.mute && isBgm) return;
      if (isBgm) {
        this.bgmRequested = s;
        this.pendingBgm = s;
      }
      s.stop();
      const r = s.play();
      if (isBgm && r && typeof r.then === 'function') {
        r.then((ok) => {
          if (ok) {
            if (this.pendingBgm === s) this.pendingBgm = null;
          } else if (!this.mute) {
            this.pendingBgm = s;
          }
        }).catch(() => {
          if (!this.mute) this.pendingBgm = s;
        });
      } else if (isBgm) {
        this.pendingBgm = null;
      }
    }
    stop(s) {
      if (s) s.stop();
    }
    isplaying(s) {
      return !!(s && s.audio && !s.audio.paused && !s.audio.ended);
    }
  }

  const Audio = new AudioSystem();

      if (r === 1) { this.aiimg[0] = this.ship2; this.aidx[0] = 6; }

      this.aiy[0] = this.SH / 2 - this.SH / 4 + Game._rnd((this.SH / 4 * 2) | 0);

        case 4: return this.sndmusic4;

      if (this.hintidx === 1) { this.handtab = this.handtab1.slice(); for (let i = 0; i < 5; i++) this.map[i + this.MU * 0] = 3; }
      if (this.hintidx === 2) { this.handtab = this.handtab2.slice(); this.map[0 + this.MU * 1] = 1; for (let i = 1; i < 4; i++) this.map[i + this.MU * 1] = 3; }
      if (this.hintidx === 3) { this.handtab = this.handtab3.slice(); for (let i = 0; i < 2; i++) { this.map[0 + i + this.MU * 2] = 3; this.map[3 + i + this.MU * 2] = 3; } }
      if (this.hintidx === 4) { this.handtab = this.handtab4.slice(); this.map[0 + this.MU * 3] = 3; for (let i = 0; i < 3; i++) this.map[2 + i + this.MU * 3] = 3; }
      if (this.hintidx === 5) { this.handtab = this.handtab5.slice(); }
      if (this.hintidx === 6) {
        this.handtab = this.handtab6.slice();
        this.map[4 + this.MU * 1] = 4; this.map[2 + this.MU * 2] = 4; this.map[1 + this.MU * 3] = 4;
        this.map[0 + this.MU * 4] = 4; this.map[1 + this.MU * 4] = 4; this.map[3 + this.MU * 4] = 4; this.map[4 + this.MU * 4] = 4;
      }
      if (this.hintidx === 7) { this.handtab = this.handtab7.slice(); }
      if (this.hintidx === 8) { this.handtab = this.handtab8.slice(); this.map[2 + this.MU * 4] = 3; }

    }

    overlapgeneral(t1x, t1y, w1x, w1y, t2x, t2y, w2x, w2y) {
      w1x -= 1; w1y -= 1; w2x -= 1; w2y -= 1;
      if (t1x < t2x) {
        if (t2x - t1x > w1x) return false;
        if (t1y < t2y) return !(t2y - t1y > w1y);
        return !(t1y - t2y > w2y);
      }
      if (t1x - t2x > w2x) return false;
      if (t1y < t2y) return !(t2y - t1y > w1y);
      return !(t1y - t2y > w2y);
    }

    overlap(s1, s2) {
      if (!s1 || !s2) return false;
      if (!s1.exists || !s2.exists) return false;
      return this.overlapgeneral(
        s1.x - s1.offset.x, s1.y - s1.offset.y, s1.width, s1.height,
        s2.x - s2.offset.x, s2.y - s2.offset.y, s2.width, s2.height
      );
    }

    static _drawImage(img, x, y, anc) {
      if (!img) return;
      let dx = x;
      let dy = y;
      if (anc !== 0) {
        const w = img.width;
        const h = img.height;
        if ((anc & VCENTER) !== 0) dy -= h >> 1;
        else if ((anc & BOTTOM) !== 0) dy -= h;
        if ((anc & HCENTER) !== 0) dx -= w >> 1;
        else if ((anc & RIGHT) !== 0) dx -= w;
      }
      const oldx = img.x, oldy = img.y;
      img.x = dx;
      img.y = dy;
      img.render();
      img.x = oldx;
      img.y = oldy;
    }

    static _drawSpriteRaw(img) {
      ctx.save();
      ctx.globalAlpha = img.alpha;
      ctx.translate(img.x, img.y);
      if (img.scale.x !== 1 || img.scale.y !== 1) ctx.scale(img.scale.x, img.scale.y);
      if (img.angle) ctx.rotate(img.angle * Math.PI / 180);

      if (img.image && img.imageLoaded) {
          const fw = img.frameWidth || img.width || img.image.width;
          const fh = img.frameHeight || img.height || img.image.height;
          const frame = Math.min(img.frame, Math.max(0, img.frames - 1));
          const sheetWidth = img.image.width;
          const cols = Math.max(1, Math.floor(sheetWidth / fw));
          let sx = frame * fw;
          let sy = 0;
          if (sx >= sheetWidth) {
            sy = Math.floor(sx / sheetWidth) * fh;
            sx = sx % sheetWidth;
          } else {
            sy = Math.floor(frame / cols) * fh;
            sx = (frame % cols) * fw;
          }
          ctx.drawImage(img.image, sx, sy, fw, fh, 0, 0, img.width, img.height);
      } else if (img.sourceName) {
        Game.drawMissingImageSprite(img);
      } else if (img.customDraw) {
        img.customDraw(ctx, img);
      } else {
        Game.drawPlaceholderSprite(img);
      }
      ctx.restore();
    }


    static drawMissingImageSprite(img) {
      ctx.fillStyle = MISSING_IMAGE_COLOR;
      ctx.fillRect(0, 0, MISSING_IMAGE_W, MISSING_IMAGE_H);
    }

    static drawPlaceholderSprite(img) {
      const w = img.width || 64;
      const h = img.height || 64;
      const kind = img.placeholderKind || 'rect';
      const frame = img.frame || 0;
      const colors = {
        bg: '#1c2342', bg2: '#24386d', bgred: '#8c1228', grid: '#d8c59b',
        cellEmpty: '#e9dcc0', cellCross: '#e7dcc8', cellFull: '#333', cellFull2: '#444',
        focus: '#ffffff', ship: '#91d6ff', title: '#ffe167', legal: '#f7f7f7',
        btnPen: frame ? '#f3d04f' : '#786a2f', btnCross: frame ? '#87d7ff' : '#2f5f75',
        btnErase: frame ? '#ff8d8d' : '#7b4343', btnStart: '#83de7f', btnUndo: frame === 2 ? '#f6d96a' : frame ? '#9bc5ff' : '#4e5c73',
        btnRedo: frame === 2 ? '#f6d96a' : frame ? '#9bc5ff' : '#4e5c73', btnPause: frame ? '#ffe38a' : '#61739a',
        btnHint: frame === 2 ? '#554' : frame ? '#ffe38a' : '#9f7cff', hand: '#fff3cb', clear: '#fff59e', speaker: '#ddd'
      };

      if (kind === 'solid') {
        ctx.fillStyle = 'rgba(255,255,255,0)';
        ctx.fillRect(0, 0, w, h);
        return;
      }

      if (kind === 'bg') {
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#1c2342');
        g.addColorStop(1, '#12172e');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
        return;
      }

      if (kind === 'bg2') {
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#20315e');
        g.addColorStop(1, '#5b87db');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
        return;
      }

      if (kind === 'bgred') {
        ctx.fillStyle = '#9c1027';
        ctx.fillRect(0, 0, w, h);
        return;
      }

      if (kind === 'grid') {
        ctx.fillStyle = '#cfb98b';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#7a6338';
        ctx.lineWidth = 4;
        for (let i = 0; i <= 5; i++) {
          ctx.beginPath(); ctx.moveTo(i * (w / 5), 0); ctx.lineTo(i * (w / 5), h); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i * (h / 5)); ctx.lineTo(w, i * (h / 5)); ctx.stroke();
        }
        return;
      }

      if (kind === 'cellEmpty' || kind === 'cellCross' || kind === 'cellFull' || kind === 'cellFull2' || kind === 'solidWhite') {
        if (kind === 'solidWhite') {
          ctx.fillStyle = Game.colorToCss(img.color != null ? img.color : 0xffffff);
          ctx.fillRect(0, 0, w, h);
          return;
        }
        ctx.fillStyle = kind === 'cellEmpty' ? '#eadfca' : (kind === 'cellFull' || kind === 'cellFull2' ? '#222' : '#eadfca');
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#8f7c56';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, w, h);
        if (kind === 'cellCross') {
          ctx.strokeStyle = '#8a5c41';
          ctx.lineWidth = 6;
          ctx.beginPath(); ctx.moveTo(18, 18); ctx.lineTo(w - 18, h - 18); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(w - 18, 18); ctx.lineTo(18, h - 18); ctx.stroke();
        }
        return;
      }

      if (kind === 'focus') {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 5;
        ctx.strokeRect(0, 0, w, h);
        return;
      }

      if (kind === 'strike') {
        ctx.strokeStyle = '#b9dfff';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
        return;
      }

      if (kind === 'ship') {
        ctx.fillStyle = '#b6ecff';
        ctx.beginPath();
        ctx.ellipse(w / 2, h / 2, w / 2.4, h / 3.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#1c3e52';
        ctx.lineWidth = 3;
        ctx.stroke();
        return;
      }

      if (kind === 'ground') {
        ctx.fillStyle = '#5d3c1f';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#7e5728';
        for (let i = 0; i < 18; i++) ctx.fillRect(i * 80, 0, 40, h);
        return;
      }

      if (kind === 'title') {
        ctx.fillStyle = '#0000';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#ffe679';
        ctx.font = 'bold 68px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        return;
      }

      if (kind === 'legal') {
        ctx.fillStyle = '#fff';
        ctx.font = '20px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        return;
      }

      if (kind === 'clear') {
        ctx.fillStyle = '#fff9ad';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#5b5215';
        ctx.lineWidth = 4;
        ctx.strokeRect(0, 0, w, h);
        ctx.fillStyle = '#443';
        ctx.font = 'bold 40px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        return;
      }

      if (kind === 'speaker') {
        ctx.fillStyle = '#1a1a1a88';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = frame ? '#a33' : '#ddd';
        ctx.beginPath();
        ctx.moveTo(18, 40); ctx.lineTo(30, 40); ctx.lineTo(48, 24); ctx.lineTo(48, 72); ctx.lineTo(30, 56); ctx.lineTo(18, 56); ctx.closePath();
        ctx.fill();
        if (frame) {
          ctx.strokeStyle = '#f88';
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(52, 24); ctx.lineTo(68, 72); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(68, 24); ctx.lineTo(52, 72); ctx.stroke();
        } else {
          ctx.strokeStyle = '#ddd';
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(50, 48, 14, -0.8, 0.8); ctx.stroke();
          ctx.beginPath(); ctx.arc(50, 48, 24, -0.8, 0.8); ctx.stroke();
        }
        return;
      }

      if (kind.startsWith('btn')) {
        ctx.fillStyle = colors[kind] || '#555';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 4;
        ctx.strokeRect(0, 0, w, h);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        return;
      }

      if (kind === 'hand') {
        ctx.fillStyle = '#fff2c4';
        ctx.beginPath();
        ctx.arc(w / 2, h / 2, Math.min(w, h) / 2.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#5a4c30';
        ctx.lineWidth = 3;
        ctx.stroke();
        return;
      }

      ctx.fillStyle = colors[kind] || '#777';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = '#000';
      ctx.strokeRect(0, 0, w, h);
    }

    drawtext(s, x, y, anc, col = 0xffffff) {
      if (!BITMAPFONT) {
        const lines = String(s).split('\n');
        const fontSize = this.font === this.font2 ? 32 : (this.font === this.font3 ? 18 : 24);
        const lineHeight = this.font === this.font2 ? 38 : (this.font === this.font3 ? 18 : 24);
        let yy = y;
        const totalh = lineHeight * lines.length;
        if (anc & BOTTOM) yy -= totalh;
        if (anc & VCENTER) yy -= totalh / 2;
        ctx.save();
        ctx.fillStyle = Game.colorToCss(col);
        ctx.font = `bold ${fontSize}px Arial`;
        ctx.textBaseline = 'top';
        for (const line of lines) {
          const m = ctx.measureText(line);
          let xx = x;
          if (anc & HCENTER) xx -= m.width / 2;
          if (anc & RIGHT) xx -= m.width;
          ctx.fillText(line, xx, yy);
          yy += lineHeight + 1;
        }
        ctx.restore();
        return;
      }

      const tabw = new Array(MAXAI).fill(0);
      const tabx = new Array(MAXAI).fill(0);
      let x2 = x - 0;
      let y2 = y - 0;
      let l = 0;
      let c = 0;
      s = String(s);

      for (let i = 0; i < s.length; i++) {
        const ch = s.charCodeAt(i);
        if (ch === 10) {
          tabw[c++] = l;
          l = 0;
        } else {
          if (ch === '~'.charCodeAt(0)) l += this.font.width / 4;
          else if (ch === '#'.charCodeAt(0)) l += this.font.width / 3;
          l += this.font.width;
        }
      }
      tabw[c++] = l;

      for (let i = 0; i < c; i++) {
        tabx[i] = x2;
        if (anc & HCENTER) tabx[i] -= tabw[i] / 2;
        if (anc & RIGHT) tabx[i] -= tabw[i];
      }

      if (anc & BOTTOM) y2 -= this.font.height * c;
      if (anc & VCENTER) y2 -= this.font.height * c / 2;

      c = 0;
      x2 = tabx[c++];
      this.font.color = col;
      for (let i = 0; i < s.length; i++) {
        const ch = s.charCodeAt(i);
        if (ch === 10) {
          x2 = tabx[c++];
          y2 += this.font.height + 1;
          continue;
        }
        this.font.x = x2;
        this.font.y = y2;
        this.font.frame = this.fonttab[ch] || 0;
        if (ch === '#'.charCodeAt(0)) x2 -= this.font.width / 1.5;
        else if (ch === ' '.charCodeAt(0)) {}
        else if (ch === '~'.charCodeAt(0)) {}
        else Game._drawImage(this.font, this.font.x, this.font.y, LEFT | TOP);

        if (ch === '~'.charCodeAt(0)) x2 += this.font.width / 4;
        else x2 += this.font.width;
      }
      this.font.color = 0xffffff;
    }

    _drawtext2(s, x, y, anc, col = 0xfffff0) {
      const t = 2;
      this.drawtext(s, x - t, y, anc, 0x202020);
      this.drawtext(s, x + t, y, anc, 0x202020);
      this.drawtext(s, x, y - t, anc, 0x202020);
      this.drawtext(s, x, y + t, anc, 0x202020);
      this.drawtext(s, x, y, anc, col);
    }

    drawtext2(s, x, y, anc, col = 0xfffff0) {
      this._drawtext2(s, x, y, anc, col);
    }

    drawtextRotated(s, x, y, angle = 0, col = 0xffffff, fontSize = 24) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      ctx.fillStyle = Game.colorToCss(col);
      ctx.font = `bold ${fontSize}px Arial`;
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      const lines = String(s).split('\n');
      const lineHeight = Math.round(fontSize * 1.1);
      for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], 0, i * lineHeight);
      ctx.restore();
    }

    drawdigits(s, x, y, anc) {
      if (!BITMAPFONT) {
        const text = String(s);
        const fontSize = this.digits === this.digits2 ? 18 : 28;
        const lineHeight = this.digits === this.digits2 ? 18 : 28;
        ctx.save();
        ctx.font = `bold ${fontSize}px Arial`;
        const width = ctx.measureText('0').width + 4;
        let count = 0;
        for (const ch of text) if ((ch >= '0' && ch <= '9') || ch === ':') count++;
        let x2 = x;
        let y2 = y;
        const totalh = lineHeight * count;
        if (anc !== 0) {
          if ((anc & VCENTER) !== 0) y2 -= totalh >> 1;
          else if ((anc & BOTTOM) !== 0) y2 -= totalh;
          if ((anc & HCENTER) !== 0) x2 -= width >> 1;
          else if ((anc & RIGHT) !== 0) x2 -= width;
        }
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        for (let i = text.length - 1; i >= 0; i--) {
          const ch = text[i];
          if ((ch >= '0' && ch <= '9') || ch === ':') {
            ctx.fillText(ch, x2, y2);
            y2 += lineHeight;
          }
        }
        ctx.restore();
        return;
      }

      let x2 = x;
      let y2 = y;
      let count = 0;
      let frameidx;
      let ch;
      const w = this.digits.width;
      const h = this.digits.height;
      const len = String(s).length;
      let totalh = 0;
      s = String(s);

      for (let i = 0; i < len; i++) {
        ch = s.charCodeAt(i);
        if ((ch >= '0'.charCodeAt(0) && ch <= '9'.charCodeAt(0)) || ch === ':'.charCodeAt(0)) count++;
      }

      totalh = h * count;
      if (anc !== 0) {
        if ((anc & VCENTER) !== 0) y2 -= totalh >> 1;
        else if ((anc & BOTTOM) !== 0) y2 -= totalh;
        if ((anc & HCENTER) !== 0) x2 -= w >> 1;
        else if ((anc & RIGHT) !== 0) x2 -= w;
      }

      for (let i = len - 1; i >= 0; i--) {
        ch = s.charCodeAt(i);
        frameidx = -1;
        if (ch >= '0'.charCodeAt(0) && ch <= '9'.charCodeAt(0)) frameidx = ch - '0'.charCodeAt(0);
        else if (ch === ':'.charCodeAt(0)) frameidx = 10;
        if (frameidx >= 0) {
          this.digits.frame = frameidx;
          Game._drawImage(this.digits, x2, y2, LEFT | TOP);
          y2 += h;
        }
      }
    }

    drawClock() {

      const t = (this.timer / 60) | 0;
      const s = t % 60;
      const m = ((t / 60) | 0) % 60;
      const h = (t / 3600) | 0;
      const ss = (s < 10 ? '0' : '') + s;
      const mm = (m < 10 ? '0' : '') + m;
      const hh = (h < 10 ? '0' : '') + h;
      this.font = this.font2;
      this.drawtext(hh + ':' + mm + ':' + ss, this.watch.x, this.watch.y, LEFT | TOP);
      this.font = this.font1;
    }

    drawHints() {
      this.font = this.font3;
      this.drawtext(String(this.hintnum), this.hints.x, this.hints.y, HCENTER | TOP);
      this.font = this.font1;
    }

    buildCluesFromSolution(isRow, line) {
      const out = [];
      let run = 0;
      const lineLen = isRow ? this.MU : this.MV;
      for (let i = 0; i < lineLen; i++) {
        const n = isRow ? line * this.MU + i : i * this.MU + line;
        if (this.leveltab[this.level][n] === '#') run++;
        else if (run > 0) { out.push(run); run = 0; }
      }
      if (run > 0) out.push(run);
      if (out.length === 0) out.push(0);
      return out;
    }

    buildCluesFromMap(isRow, line) {
      const out = [];
      let run = 0;
      const lineLen = isRow ? this.MU : this.MV;
      let solved = true;
      for (let i = 0; i < lineLen; i++) {
        const n = isRow ? line * this.MU + i : i * this.MU + line;
        const filled = this.map[n];
        const sol = this.leveltab[this.level][n];
        if (filled === 1) run++;
        else {
          if (run > 0) { out.push(run); run = 0; }
          if (filled !== 1 && sol === '#') solved = false;
        }
        if (filled === 1 && sol !== '#') solved = false;
      }
      if (run > 0) out.push(run);
      return { clues: out, solved };
    }

    drawNonogramNumbers() {
      const oldFont = this.font;
      this.font = this.font2;
      for (let v = 0; v < this.MV; v++) {
        const clue = this.buildCluesFromSolution(true, v);
        const actual = this.buildCluesFromMap(true, v);
        let solved = actual.solved && actual.clues.length === clue.length;
        if (solved) {
          for (let i = 0; i < clue.length; i++) if (actual.clues[i] !== clue[i]) solved = false;
        }
        for (let i = 0; i < clue.length; i++) {
          let prefixSolved = true;
          if (i >= actual.clues.length) prefixSolved = false;
          else {
            for (let k = 0; k < i; k++) if (actual.clues[k] !== clue[k]) prefixSolved = false;
            if (prefixSolved && actual.clues[i] !== clue[i]) prefixSolved = false;
          }
          const x = this.grid.x - 20 - 10 - (clue.length - 1 - i) * 40;
          const y = this.grid.y + v * this.MH + this.MH / 2;
          this.drawtext(String(clue[i]), x, y, HCENTER | VCENTER, prefixSolved ? 0xc8f0ff : 0xffffff);
          if (solved) Game._drawImage(this.strike, x, y, HCENTER | VCENTER);
        }
      }
      for (let u = 0; u < this.MU; u++) {
        const clue = this.buildCluesFromSolution(false, u);
        const actual = this.buildCluesFromMap(false, u);
        let solved = actual.solved && actual.clues.length === clue.length;
        if (solved) {
          for (let i = 0; i < clue.length; i++) if (actual.clues[i] !== clue[i]) solved = false;
        }
        for (let i = 0; i < clue.length; i++) {
          let prefixSolved = true;
          if (i >= actual.clues.length) prefixSolved = false;
          else {
            for (let k = 0; k < i; k++) if (actual.clues[k] !== clue[k]) prefixSolved = false;
            if (prefixSolved && actual.clues[i] !== clue[i]) prefixSolved = false;
          }
          const x = this.grid.x + u * this.MW + this.MW / 2;
          const y = this.grid.y - 20 - (clue.length - 1 - i) * (this.font2.height + 6);
          this.drawtext(String(clue[i]), x, y, HCENTER | BOTTOM, prefixSolved ? 0xc8f0ff : 0xffffff);
          if (solved) Game._drawImage(this.strike, x, y - this.font2.height / 2, HCENTER | VCENTER);
        }
      }
      this.font = oldFont;
    }

    autoFillEmptyLine(isRow, line) {
      const lineLen = isRow ? this.MU : this.MV;
      const clueRuns = [];
      const groupRuns = [];
      let run = 0;
      for (let i = 0; i < lineLen; i++) {
        const n = isRow ? line * this.MU + i : i * this.MU + line;
        if (this.leveltab[this.level][n] === '#') run++;
        else if (run > 0) { clueRuns.push(run); run = 0; }
      }
      if (run > 0) clueRuns.push(run);

      run = 0;
      for (let i = 0; i < lineLen; i++) {
        const n = isRow ? line * this.MU + i : i * this.MU + line;
        if (this.map[n] === 1) run++;
        else if (run > 0) { groupRuns.push(run); run = 0; }
      }
      if (run > 0) groupRuns.push(run);

      let canClose = groupRuns.length === clueRuns.length;
      if (canClose) {
        for (let i = 0; i < clueRuns.length; i++) if (groupRuns[i] !== clueRuns[i]) canClose = false;
      }
      if (!canClose) return;
      for (let i = 0; i < lineLen; i++) {
        const n = isRow ? line * this.MU + i : i * this.MU + line;
        if (this.map[n] === 0) this.map[n] = 2;
      }
    }

    autoFillEmptyAt(u, v) {
      this.autoFillEmptyLine(true, v);
      this.autoFillEmptyLine(false, u);
    }

    pushUndoState() {
      let count = this.MU * this.MV;
      if (count <= 0) return;
      if (count > MAXU * MAXV) count = MAXU * MAXV;
      let base;
      if (this.undoCount < MAXUNDOSTATES) {
        base = this.undoCount * MAXU * MAXV;
        this.undoCount++;
      } else {
        for (let state = 1; state < MAXUNDOSTATES; state++) {
          for (let j = 0; j < MAXU * MAXV; j++) {
            this.undoStack[(state - 1) * MAXU * MAXV + j] = this.undoStack[state * MAXU * MAXV + j];
          }
        }
        base = (MAXUNDOSTATES - 1) * MAXU * MAXV;
      }
      for (let i = 0; i < count; i++) this.undoStack[base + i] = this.map[i];
      for (let i = count; i < MAXU * MAXV; i++) this.undoStack[base + i] = MAP_NONE;
      this.redoCount = 0;
    }

    doUndo() {
      let count = this.MU * this.MV;
      if (this.undoCount <= 0) return;
      if (count > MAXU * MAXV) count = MAXU * MAXV;
      let redoBase;
      if (this.redoCount < MAXUNDOSTATES) {
        redoBase = this.redoCount * MAXU * MAXV;
        this.redoCount++;
      } else {
        for (let state = 1; state < MAXUNDOSTATES; state++) {
          for (let j = 0; j < MAXU * MAXV; j++) {
            this.redoStack[(state - 1) * MAXU * MAXV + j] = this.redoStack[state * MAXU * MAXV + j];
          }
        }
        redoBase = (MAXUNDOSTATES - 1) * MAXU * MAXV;
      }
      for (let i = 0; i < count; i++) this.redoStack[redoBase + i] = this.map[i];
      for (let i = count; i < MAXU * MAXV; i++) this.redoStack[redoBase + i] = MAP_NONE;
      this.undoCount--;
      const undoBase = this.undoCount * MAXU * MAXV;
      for (let i = 0; i < count; i++) this.map[i] = this.undoStack[undoBase + i];
    }

    doRedo() {
      let count = this.MU * this.MV;
      if (this.redoCount <= 0) return;
      if (count > MAXU * MAXV) count = MAXU * MAXV;
      let undoBase;
      if (this.undoCount < MAXUNDOSTATES) {
        undoBase = this.undoCount * 15 * 15;
        this.undoCount++;
      } else {
        for (let state = 1; state < MAXUNDOSTATES; state++) {
          for (let j = 0; j < MAXU * MAXV; j++) {
            this.undoStack[(state - 1) * MAXU * MAXV + j] = this.undoStack[state * MAXU * MAXV + j];
          }
        }
        undoBase = (MAXUNDOSTATES - 1) * 15 * 15;
      }
      for (let i = 0; i < count; i++) this.undoStack[undoBase + i] = this.map[i];
      for (let i = count; i < MAXU * MAXV; i++) this.undoStack[undoBase + i] = MAP_NONE;
      this.redoCount--;
      const redoBase = this.redoCount * MAXU * MAXV;
      for (let i = 0; i < count; i++) this.map[i] = this.redoStack[redoBase + i];
    }

    hasUndo() { return this.undoCount > 0; }
    hasRedo() { return this.redoCount > 0; }

    doHint() {
      let candidateCount = 0;
      const candidateKind = [];
      const candidateLine = [];

      for (let line = 0; line < this.MV; line++) {
        let solved = true;
        for (let i = 0; i < this.MU; i++) {
          const n = line * this.MU + i;
          if (this.leveltab[this.level][n] === '#') {
            if (this.map[n] !== 1) { solved = false; break; }
          } else {
            if (this.map[n] !== 2) { solved = false; break; }
          }
        }
        if (!solved) {
          candidateKind[candidateCount] = 0;
          candidateLine[candidateCount] = line;
          candidateCount++;
        }
      }

      for (let line = 0; line < this.MU; line++) {
        let solved = true;
        for (let i = 0; i < this.MV; i++) {
          const n = i * this.MU + line;
          if (this.leveltab[this.level][n] === '#') {
            if (this.map[n] !== 1) { solved = false; break; }
          } else {
            if (this.map[n] !== 2) { solved = false; break; }
          }
        }
        if (!solved) {
          candidateKind[candidateCount] = 1;
          candidateLine[candidateCount] = line;
          candidateCount++;
        }
      }

      if (candidateCount <= 0) return;
      const pick = Game._rnd(candidateCount);
      const kind = candidateKind[pick];
      const line = candidateLine[pick];
      this.pushUndoState();

      if (kind === 0) {
        const v = line;
        for (let u = 0; u < this.MU; u++) {
          const n = v * this.MU + u;
          this.map[n] = this.leveltab[this.level][n] === '#' ? 1 : 2;
        }
      } else {
        const u = line;
        for (let v = 0; v < this.MV; v++) {
          const n = v * this.MU + u;
          this.map[n] = this.leveltab[this.level][n] === '#' ? 1 : 2;
        }
      }
    }

    clear() {
      this.cleared = true;
      this.clearf = this.frame;
      Audio.stopall();
      Audio.play(this.sndclear);
    }

    checkclear() {
      if (this.cleared) return;
      let b = true;
      for (let i = 0; i < this.MU * this.MV; i++) {
        if (this.map[i] !== 1 && this.map[i] !== 2) { b = false; break; }
        if (this.map[i] === 1 && this.leveltab[this.level][i] !== '#') { b = false; break; }
        if (this.map[i] === 2 && this.leveltab[this.level][i] !== '.') { b = false; break; }
      }
      if (b) this.clear();
    }

    checkhintclear() {
      if (this.handtab[this.handidx] === -2) return this.tool === 1;
      if (this.handtab[this.handidx] === -3) return this.tool === 2;
      if (this.handtab[this.handidx] === -4) return this.tool === 0;
      for (let i = 0; i < this.MU * this.MV; i++) if (this.map[i] === 3 || this.map[i] === 4) return false;
      return true;
    }

    cellFromMouse() {
      for (let v = 0; v < this.MV; v++) {
        for (let u = 0; u < this.MU; u++) {
          const x = this.grid.x + u * this.MW;
          const y = this.grid.y + v * this.MH;
          if (FlxG.mouse.x >= x && FlxG.mouse.x < x + this.MW && FlxG.mouse.y >= y && FlxG.mouse.y < y + this.MH) {
            return { u, v, n: v * this.MU + u };
          }
        }
      }
      return null;
    }

    applyToolAt(u, v, n, firstPress) {
      const tutorialAllowed = !this.tutorial ||
        (this.tool === 1 && this.leveltab[this.level][n] === '#' && this.map[n] === 3) ||
        (this.tool === 2 && this.leveltab[this.level][n] === '.' && this.map[n] === 4);

      if (tutorialAllowed) {
        if (!this.drawing) this.pushUndoState();
        this.drawing = true;
        this.map[n] = this.tool;
      }

      if (firstPress) {
        if (this.tutorial && this.tool !== 1 && this.map[n] === 3) this.penf = 120;
        if (this.tutorial && this.tool !== 2 && this.map[n] === 4) this.crossf = 120;
      }

      if (!this.tutorial) this.autoFillEmptyAt(u, v);
      if (firstPress) {
        if (this.tool === MAP_FULL) Audio.play(this.sndfull);
        if (this.tool === 2) Audio.play(this.sndcross);
        if (this.tool === 0) Audio.play(this.snderase);
      }
    }


    ensureMenuMusic() {
      if (Audio.mute) return;
      let p = false;
      switch (this.bgmidx) {
        case 0: p = Audio.isplaying(this.sndmusic0); break;
        case 1: p = Audio.isplaying(this.sndmusic1); break;
        case 2: p = Audio.isplaying(this.sndmusic2); break;
        case 3: p = Audio.isplaying(this.sndmusic3); break;
        case 4: p = Audio.isplaying(this.sndmusic4); break;
        case 5: p = Audio.isplaying(this.sndmusic5); break;
      }
      if (!p) this.startmusic();
    }

    update2() {
      if (this.issplash) {
        if (FlxG.keys.justPressed('ESCAPE')) {
          try { window.close(); } catch (e) {}
        }
        if (FlxG.keys.justPressed('F')) FlxG.setFullScreen(!FlxG.fullscreen);
        if (FlxG.keys.justPressed('M')) this.toggleSound();

        this.bgred.alpha -= 0.05;
        if (this.bgred.alpha < 0) this.bgred.alpha = 0;
        if (this.frame === 60 * 2 || FlxG.keys.justPressed('ENTER') || FlxG.keys.justPressed('SPACE') || FlxG.mouse.justPressed()) {
          this.skipspace = true;
          this.skipenter = true;
          this.create3();
          this.issplash = false;
          if (!Audio.mute) {
            const s = this.currentbgm();
            if (s) Audio.play(s);
          }
          this.ensureMenuMusic();
        }

        this.frame++;
        return;
      }

      if (this.scene === this.SCENE_MENU) {
        this.ensureMenuMusic();
        if (FlxG.keys.justPressed('ESCAPE')) {
          try { window.close(); } catch (e) {}
        }
        if (FlxG.keys.justPressed('F')) FlxG.setFullScreen(!FlxG.fullscreen);
        if (FlxG.keys.justPressed('M')) this.toggleSound();

        if (FlxG.mouse.justPressed()) {
          if (this.overlapgeneral(FlxG.mouse.x, FlxG.mouse.y, 1, 1, this.bgm.x, this.bgm.y, this.bgm.width, this.bgm.height)) this.toggleSound();
        }

        if (!FlxG.mouse.pressed()) this.btnstart.frame = 0;
        if (FlxG.mouse.pressed()) {
          if (this.overlapgeneral(FlxG.mouse.x, FlxG.mouse.y, 1, 1, this.btnstart.x, this.btnstart.y, this.btnstart.width, this.btnstart.height)) this.btnstart.frame = 1;
        }
        if (FlxG.mouse.justReleased()) {
          if (this.overlapgeneral(FlxG.mouse.x, FlxG.mouse.y, 1, 1, this.btnstart.x, this.btnstart.y, this.btnstart.width, this.btnstart.height)) {
            this.wasspace = false;
            this.wasenter = false;
            this.scene = this.SCENE_GAME;
            this.setmusic();
            Audio.play(this.sndstart);
          }
        }

        if (FlxG.keys.pressed('ENTER')) {
          if (!this.skipenter) {
            this.btnstart.frame = 1;
            this.wasenter = true;
          }
        } else {
          this.skipenter = false;
        }

        if (FlxG.keys.pressed('SPACE')) {
          if (!this.skipspace) {
            this.btnstart.frame = 1;
            this.wasspace = true;
          }
        } else {
          this.skipspace = false;
        }

        if ((!FlxG.keys.pressed('SPACE') && this.wasspace && !this.skipspace) ||
            (!FlxG.keys.pressed('ENTER') && this.wasenter && !this.skipenter)) {
          this.wasspace = false;
          this.wasenter = false;
          this.scene = this.SCENE_GAME;
          this.setmusic();
          Audio.play(this.sndstart);
        }

        this.updatemenu();
        this.frame++;
        return;
      }

      if (FlxG.mouse.justPressed()) {
        if (this.bgm && this.overlapgeneral(FlxG.mouse.x, FlxG.mouse.y, 1, 1, this.bgm.x, this.bgm.y, this.bgm.width, this.bgm.height)) this.toggleSound();
      }

      if (!this.grid || !this.btnpen || !this.btncross || !this.btnerase || !this.btnundo || !this.btnredo || !this.btnpause || !this.btnhint) {
        if (this.scene === this.SCENE_GAME && !this.cleared) this.timer++;
        this.frame++;
        return;
      }

      if (FlxG.keys.justPressed('ENTER')) {
        if (this.cleared) this.frame = this.clearf + 60 * 6; else this.initlevel();
      }
      if (FlxG.keys.justPressed('ESCAPE')) { this.scene = this.SCENE_MENU; this.setmusic(); Audio.play(this.sndback); }
      if (FlxG.keys.justPressed('F')) FlxG.setFullScreen(!FlxG.fullscreen);
      if (FlxG.keys.justPressed('M')) this.toggleSound();
      if (FlxG.keys.justPressed('PAGEDOWN')) { this.level = this.level < MAXLEVEL ? this.level + 1 : 1; this.initlevel(); }
      if (FlxG.keys.justPressed('PAGEUP')) { this.level = this.level > 1 ? this.level - 1 : MAXLEVEL; this.initlevel(); }
      if (FlxG.keys.justPressed('HOME')) { this.level = 1; this.initlevel(); }
      if (FlxG.keys.justPressed('END')) { this.level = MAXLEVEL; this.initlevel(); }
      if (FlxG.keys.justPressed('F12')) this.clear();
      if (FlxG.keys.justPressed('H') && !this.tutorial && this.hintnum > 0) { this.doHint(); if (this.hintnum > 0) this.hintnum--; this.checkclear(); Audio.play(this.sndrowcol); }
      if (FlxG.keys.justPressed('U') && !this.tutorial && this.hasUndo()) { this.doUndo(); this.btnundo.frame = this.hasUndo() ? 1 : 0; Audio.play(this.sndundo); }
      if (FlxG.keys.justPressed('R') && !this.tutorial && this.hasRedo()) { this.doRedo(); this.btnredo.frame = this.hasRedo() ? 1 : 0; Audio.play(this.sndfull); }
      if (FlxG.keys.justPressed('LEFT') && this.cu > 0) this.cu--;
      if (FlxG.keys.justPressed('RIGHT') && this.cu < this.MU - 1) this.cu++;
      if (FlxG.keys.justPressed('UP') && this.cv > 0) this.cv--;
      if (FlxG.keys.justPressed('DOWN') && this.cv < this.MV - 1) this.cv++;
      if (!FlxG.keys.pressed('SPACE')) this.skipspace = false;

      if (!this.skipspace && FlxG.keys.pressed('SPACE')) {
        if (this.cleared) {
          if (FlxG.keys.justPressed('SPACE')) this.frame = this.clearf + 60 * 6;
        } else {
          const n = this.cv * this.MU + this.cu;
          this.applyToolAt(this.cu, this.cv, n, FlxG.keys.justPressed('SPACE'));
        }
      }

      if (FlxG.keys.justPressed('F1') || FlxG.keys.justPressed('P')) { this.tool = MAP_FULL; this.btnpen.frame = 1; this.btncross.frame = 0; this.btnerase.frame = 0; Audio.play(this.sndtool); }
      if (FlxG.keys.justPressed('F2') || FlxG.keys.justPressed('X')) { this.tool = MAP_EMPTY; this.btnpen.frame = 0; this.btncross.frame = 1; this.btnerase.frame = 0; Audio.play(this.sndtool); }
      if ((FlxG.keys.justPressed('F3') || FlxG.keys.justPressed('E')) && !this.tutorial) { this.tool = MAP_NONE; this.btnpen.frame = 0; this.btncross.frame = 0; this.btnerase.frame = 1; Audio.play(this.sndtool); }

      if (this.hand && this.grid && this.handidx >= 0 && this.handidx < this.handtab.length) {
        if (this.handtab[this.handidx] === -2 && this.btnpen) {
          this.hand.x = this.btnpen.x + this.btnpen.width / 2 - 20;
          this.hand.y = this.btnpen.y + this.btnpen.height / 2;
        } else if (this.handtab[this.handidx] === -3 && this.btncross) {
          this.hand.x = this.btncross.x + this.btncross.width / 2 - 20;
          this.hand.y = this.btncross.y + this.btncross.height / 2;
        } else if (this.handidx + 1 < this.handtab.length) {
          this.hand.x = this.grid.x + this.handtab[this.handidx] * this.MW + this.MW / 2 - 20;
          this.hand.y = this.grid.y + this.handtab[this.handidx + 1] * this.MH + this.MH / 2;
        }
      }

      this.handf++;
      if (this.handf === 60) {
        if (this.handtab[this.handidx] === -2 || this.handtab[this.handidx] === -3 || this.handtab[this.handidx] === -4) this.handidx += 1;
        else this.handidx += 2;
        if (this.handtab[this.handidx] === -1 || this.handidx >= this.handtab.length) this.handidx = MAP_NONE;
        this.handf = 0;
      }

      if (FlxG.mouse.justPressed()) {
        if (this.overlapgeneral(FlxG.mouse.x, FlxG.mouse.y, 1, 1, this.btnpen.x, this.btnpen.y, this.btnpen.width, this.btnpen.height)) { this.tool = MAP_FULL; this.btnpen.frame = 1; this.btncross.frame = 0; this.btnerase.frame = 0; Audio.play(this.sndtool); }
        if (this.overlapgeneral(FlxG.mouse.x, FlxG.mouse.y, 1, 1, this.btncross.x, this.btncross.y, this.btncross.width, this.btncross.height)) { this.tool = MAP_EMPTY; this.btnpen.frame = 0; this.btncross.frame = 1; this.btnerase.frame = 0; Audio.play(this.sndtool); }
        if (this.overlapgeneral(FlxG.mouse.x, FlxG.mouse.y, 1, 1, this.btnerase.x, this.btnerase.y, this.btnerase.width, this.btnerase.height) && !this.tutorial) { this.tool = MAP_NONE; this.btnpen.frame = 0; this.btncross.frame = 0; this.btnerase.frame = 1; Audio.play(this.sndtool); }
      }

      if (FlxG.mouse.justPressed()) {
        if (this.overlapgeneral(FlxG.mouse.x, FlxG.mouse.y, 1, 1, this.btnundo.x, this.btnundo.y, this.btnundo.width, this.btnundo.height) && !this.tutorial && this.hasUndo()) this.btnundo.frame = 2;
        if (this.overlapgeneral(FlxG.mouse.x, FlxG.mouse.y, 1, 1, this.btnredo.x, this.btnredo.y, this.btnredo.width, this.btnredo.height) && !this.tutorial && this.hasRedo()) this.btnredo.frame = 2;
        if (this.overlapgeneral(FlxG.mouse.x, FlxG.mouse.y, 1, 1, this.btnhint.x, this.btnhint.y, this.btnhint.width, this.btnhint.height) && !this.tutorial && this.hintnum > 0) this.btnhint.frame = 1;
        if (this.overlapgeneral(FlxG.mouse.x, FlxG.mouse.y, 1, 1, this.btnpause.x, this.btnpause.y, this.btnpause.width, this.btnpause.height)) this.btnpause.frame = 1;
      }

      if (FlxG.mouse.justReleased()) {
        if (this.overlapgeneral(FlxG.mouse.x, FlxG.mouse.y, 1, 1, this.btnundo.x, this.btnundo.y, this.btnundo.width, this.btnundo.height) && !this.tutorial && this.hasUndo()) { this.doUndo(); Audio.play(this.sndback); }
        if (this.overlapgeneral(FlxG.mouse.x, FlxG.mouse.y, 1, 1, this.btnredo.x, this.btnredo.y, this.btnredo.width, this.btnredo.height) && !this.tutorial && this.hasRedo()) { this.doRedo(); Audio.play(this.sndfull); }
        if (this.overlapgeneral(FlxG.mouse.x, FlxG.mouse.y, 1, 1, this.btnhint.x, this.btnhint.y, this.btnhint.width, this.btnhint.height) && !this.tutorial && this.hintnum > 0) { this.doHint(); if (this.hintnum > 0) this.hintnum--; this.checkclear(); Audio.play(this.sndrowcol); }
        if (this.overlapgeneral(FlxG.mouse.x, FlxG.mouse.y, 1, 1, this.btnpause.x, this.btnpause.y, this.btnpause.width, this.btnpause.height)) { this.scene = this.SCENE_MENU; Audio.play(this.sndback); }
      }

      if (!FlxG.mouse.pressed()) {
        this.btnundo.frame = this.tutorial ? 0 : this.hasUndo() ? 1 : 0;
        this.btnredo.frame = this.tutorial ? 0 : this.hasRedo() ? 1 : 0;
        this.btnhint.frame = this.tutorial ? 2 : this.hintnum > 0 ? 0 : 2;
        this.btnpause.frame = 0;
      }

      if (FlxG.mouse.pressed()) {
        const cell = this.cellFromMouse();
        if (cell) this.applyToolAt(cell.u, cell.v, cell.n, FlxG.mouse.justPressed());
      }

      if (!FlxG.mouse.pressed() && !FlxG.keys.pressed('SPACE') && this.drawing) {
        this.drawing = false;
        this.btnundo.frame = this.tutorial ? 0 : this.hasUndo() ? 1 : 0;
        this.btnredo.frame = this.tutorial ? 0 : this.hasRedo() ? 1 : 0;
      }

      if (this.tutorial && this.checkhintclear()) { this.hintidx++; this.sethint(); }
      this.checkclear();

      if (this.cleared) {
        this.blank.alpha += 0.01;
        if (this.blank.alpha >= 1) { this.blank.alpha = 1; this.glossf++; if (this.glossf % 7 === 0) this.gloss = (this.gloss + 1) % 13; }
        if (this.frame === this.clearf + CLEARWAIT) { this.level = this.level < MAXLEVEL ? this.level + 1 : 2; this.initlevel(); }
      }

      if (this.penf > 0) this.penf--;
      if (this.crossf > 0) this.crossf--;
      if (this.scene === this.SCENE_GAME && !this.cleared) this.timer++;
      this.frame++;
    }

    drawPuzzleCells() {
      const colbase = this.level * this.MU * this.MV;
      for (let v = 0; v < this.MV; v++) {
        for (let u = 0; u < this.MU; u++) {
          const x = this.grid.x + u * this.MW;
          const y = this.grid.y + v * this.MH;
          const n = v * this.MU + u;
          const cell = this.map[n];

          if (cell === MAP_FULL2) Game._drawImage(this.full2, x, y, LEFT | TOP);
          if (cell === MAP_EMPTY2) Game._drawImage(this.empty2, x, y, LEFT | TOP);
          if (cell === MAP_FULL) {
            const sp = this.full;
            if (!sp.image || !sp.imageLoaded) {
              ctx.save();
              ctx.fillStyle = Game.colorToCss(this.colortab[(colbase + n) % this.colortab.length]);
              ctx.fillRect(x + 8, y + 8, this.MW - 16, this.MH - 16);
              ctx.restore();
            } else {
              sp.frame = 0;
              Game._drawImage(sp, x, y, LEFT | TOP);
            }
          }
          if (cell === MAP_EMPTY) Game._drawImage(this.empty, x, y, LEFT | TOP);

          if (!this.cleared && u === this.cu && v === this.cv) {
            Game._drawImage(this.focus, x - 1, y - 1, LEFT | TOP);
            this.focus3.alpha = 0.5 + Math.sin(this.frame / 10.0) / 2;
            Game._drawImage(this.focus3, x - 1, y - 1, LEFT | TOP);
          }

          if (this.cleared) {
            this.blank.color = this.colortab[colbase + n];
            Game._drawImage(this.blank, x, y, LEFT | TOP);
          }
        }
      }
    }

    render2() {
      ctx.clearRect(0, 0, this.SW, this.SH);

      if (this.issplash) {
        Game._drawImage(this.splash, 0, 0, LEFT | TOP);
        Game._drawImage(this.bgred, 0, 0, LEFT | TOP);
        return;
      }

      if (this.scene === this.SCENE_MENU) {
        Game._drawImage(this.bg2, -((this.frame * 1) % this.SW), this.SH, LEFT | BOTTOM);
        Game._drawImage(this.bg2, -((this.frame * 1) % this.SW) + this.SW, this.SH, LEFT | BOTTOM);
        this.drawmenu();
        Game._drawImage(this.ground, -((this.frame * 2) % this.SW), this.SH, LEFT | BOTTOM);
        Game._drawImage(this.ground, -((this.frame * 2) % this.SW) + this.SW, this.SH, LEFT | BOTTOM);
        Game._drawImage(this.title, this.SW / 2, 20, HCENTER | TOP);
        Game._drawImage(this.legal, this.SW / 2, 500, HCENTER | TOP);
        Game._drawImage(this.btnstart, this.btnstart.x, this.btnstart.y, LEFT | TOP);
        this.bgm.frame = Audio.mute ? 1 : 0;
        Game._drawImage(this.bgm, this.bgm.x, this.bgm.y, LEFT | TOP);
        return;
      }

      Game._drawImage(this.bg, 0, 0, LEFT | TOP);
      Game._drawImage(this.grid, this.grid.x, this.grid.y, LEFT | TOP);

      Game._drawImage(this.btnerase, this.btnerase.x, this.btnerase.y, LEFT | TOP);
      Game._drawImage(this.btncross, this.btncross.x, this.btncross.y, LEFT | TOP);
      Game._drawImage(this.btnpen, this.btnpen.x, this.btnpen.y, LEFT | TOP);
      Game._drawImage(this.btnundo, this.btnundo.x, this.btnundo.y, LEFT | TOP);
      Game._drawImage(this.btnredo, this.btnredo.x, this.btnredo.y, LEFT | TOP);
      Game._drawImage(this.btnpause, this.btnpause.x, this.btnpause.y, LEFT | TOP);
      Game._drawImage(this.btnhint, this.btnhint.x, this.btnhint.y, LEFT | TOP);

      this.buttons.frame = 0; Game._drawImage(this.buttons, this.btnpen.x + 4, this.btnpen.y + 4, LEFT | TOP);
      this.buttons.frame = 1; Game._drawImage(this.buttons, this.btncross.x + 4, this.btncross.y + 4, LEFT | TOP);
      if (!this.tutorial) {
        this.buttons.frame = 2; Game._drawImage(this.buttons, this.btnerase.x + 4, this.btnerase.y + 4, LEFT | TOP);
        this.buttons.frame = 3; Game._drawImage(this.buttons, this.btnhint.x + this.btnhint.width - this.buttons.width + 4, this.btnhint.y + this.btnhint.height - this.buttons.height + 10, LEFT | TOP);
        this.buttons.frame = 4; Game._drawImage(this.buttons, this.btnundo.x + 4, this.btnundo.y + 4, LEFT | TOP);
        this.buttons.frame = 5; Game._drawImage(this.buttons, this.btnredo.x + 4, this.btnredo.y + 4, LEFT | TOP);
      }

      if (!this.cleared) this.drawNonogramNumbers();
      this.drawPuzzleCells();
      this.drawClock();
      this.drawHints();

      let s = '';
      if (this.tutorial) {
        if (this.hintidx === 0) s = this.strtab[13];
        if (this.hintidx === 1) s = this.strtab[14];
        if (this.hintidx === 2) s = this.strtab[15];
        if (this.hintidx === 3) s = this.strtab[16];
        if (this.hintidx === 4) s = this.strtab[17];
        if (this.hintidx === 5) s = this.strtab[18];
        if (this.hintidx === 6) s = this.strtab[19];
        if (this.hintidx === 7) s = this.strtab[20];
        if (this.hintidx === 8) s = this.strtab[20];
        if (this.cleared) s = this.strtab[21];
      } else {
        s = 'Level ' + this.level;
      }
      if (s) this.drawtext2(s, this.grid.x + this.grid.width / 2, this.grid.y + this.grid.height + 50, HCENTER | TOP, 0xffffff);

      if (this.tutorial && !this.cleared && this.hand) {
        if (this.handtab[this.handidx] === -2 || this.handtab[this.handidx] === -3 || this.handtab[this.handidx] === -4) {
          if ((this.frame / 15 | 0) % 2 === 0) Game._drawImage(this.hand, this.hand.x, this.hand.y, LEFT | TOP);
        } else if (this.penf === 0 && this.crossf === 0) {
          Game._drawImage(this.hand, this.hand.x, this.hand.y, LEFT | TOP);
        }
        if (this.penf > 0 && this.btnpen && ((this.frame / 15 | 0) % 2 === 0)) {
          this.hand.x = this.btnpen.x + this.btnpen.width / 2 - 20;
          this.hand.y = this.btnpen.y + this.btnpen.height / 2;
          Game._drawImage(this.hand, this.hand.x, this.hand.y, LEFT | TOP);
        }
        if (this.crossf > 0 && this.btncross && ((this.frame / 15 | 0) % 2 === 0)) {
          this.hand.x = this.btncross.x + this.btncross.width / 2 - 20;
          this.hand.y = this.btncross.y + this.btncross.height / 2;
          Game._drawImage(this.hand, this.hand.x, this.hand.y, LEFT | TOP);
        }
      }

      if (this.cleared && this.blank.alpha === 1) {
        for (let v = 0; v < this.MV; v++) {
          for (let u = 0; u < this.MU; u++) {
            const x = this.grid.x + u * this.MW;
            const y = this.grid.y + v * this.MH;
            if (u === this.gloss && v === this.gloss && this.gloss < this.MU) {
              this.blank2.color = 0xffffff;
              this.blank2.alpha = 0.7;
              Game._drawImage(this.blank2, x, y, LEFT | TOP);
              const n = this.gloss <= (this.MU / 2 | 0) ? this.gloss : (this.MU - 1 - this.gloss);
              if (n >= 1) {
                for (let i = 1; i <= n; i++) {
                  Game._drawImage(this.blank2, x - this.MW * i, y + this.MH * i, LEFT | TOP);
                  Game._drawImage(this.blank2, x + this.MW * i, y - this.MH * i, LEFT | TOP);
                }
              }
            }
          }
        }
      }

      if (this.cleared) {
        Game._drawImage(this.puzclear, this.grid.x + this.grid.width / 2, this.grid.y - 150, HCENTER | TOP);
      }

      this.bgm.frame = Audio.mute ? 1 : 0;
      Game._drawImage(this.bgm, this.bgm.x, this.bgm.y, LEFT | TOP);
    }
  }

  // ---------------------------------------------------------------------------
  // Boot.
  // ---------------------------------------------------------------------------
  const game = new Game();
  game.create2();

  // We need beginFrame AFTER processing current frame inputs, so do one-time setup.
  // Skip rendering until image assets finish loading, so the first frame never draws partial UI.
  function loop() {
    game.update2();
    if (game.areAssetsReady()) {
      game.render2();
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    input.beginFrame();
    requestAnimationFrame(loop);
  }
  input.beginFrame();
  requestAnimationFrame(loop);
})();
</script>
